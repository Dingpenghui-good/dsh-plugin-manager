# Cordis plugin manifest for dsh-plugin-manager
# 用于插件管理器的 Cordis 配置
#
# 安装方式:
# 1. dsh plugin --profile web add <path-to-plugin>
# 2. 手动添加到 cordis.patch.yml

host:
  - id: plugin-manager
    name: '@dsh-plugin/plugin-manager/host'
    # 运行时依赖，确保在 pluginInventory 之后加载
    after:
      - plugin-inventory

client:
  - id: ui-settings-plugin-manager
    name: '@dsh-plugin/plugin-manager/client'
    # 运行时依赖，确保在 settings UI 就绪后加载
    after:
      - ui-settings
      - ui-slots
